version: 2

sources:
  - name: raw
    description: Ingested CSV files, loaded by `dbt seed`, the seam between ingestion and transformation.
    # No `schema` here on purpose. The profile names the default schema and
    # the seeds land there. A custom schema would get the default prefixed
    # to it (`main_raw`), and a clean build would fail on a missing table.
    schema: main
    tables:
      - name: orders
        identifier: raw_orders
        description: One row per order, as landed by ingestion.
        config:
          loaded_at_field: loaded_at
          freshness:
            warn_after: {count: 1, period: day}
            error_after: {count: 2, period: day}
        columns:
          - name: order_id
            data_tests:
              - unique
              - not_null

      - name: customers
        identifier: raw_customers
        description: One row per customer, as landed by ingestion.
        config:
          loaded_at_field: loaded_at
          freshness:
            warn_after: {count: 1, period: day}
            error_after: {count: 2, period: day}
        columns:
          - name: customer_id
            data_tests:
              - unique
              - not_null