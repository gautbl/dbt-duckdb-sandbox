version: 2

sources:
  - name: raw
    description: Ingested CSV files — loaded outside dbt, the seam between ingestion and transformation.
    schema: raw
    tables:
      - name: orders
        identifier: raw_orders
        description: One row per order, as landed by ingestion.
        config:
          loaded_at_field: loaded_at
          freshness:
            warn_after: {count: 1, period: day}
            error_after: {count: 2, period: day}
        columns:
          - name: order_id
            data_tests:
              - unique
              - not_null

      - name: customers
        identifier: raw_customers
        description: One row per customer, as landed by ingestion.
        config:
          loaded_at_field: loaded_at
          freshness:
            warn_after: {count: 1, period: day}
            error_after: {count: 2, period: day}
        columns:
          - name: customer_id
            data_tests:
              - unique
              - not_null