version: 2

models:
  - name: stg_customers
    description: One row per customer, cleaned from the raw_customers seed.
    columns:
      - name: customer_id
        description: Primary key of the seed.
        data_tests:
          - unique
          - not_null

  - name: stg_orders
    description: One row per order, cleaned from the raw_orders seed.
    columns:
      - name: order_id
        description: Primary key of the seed.
        data_tests:
          - unique
          - not_null
      - name: customer_id
        data_tests:
          - not_null
      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values: [completed, pending, cancelled, returned]