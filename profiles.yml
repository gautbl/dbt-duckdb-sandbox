# dbt profile for the sandbox - a complete, valid profiles.yml on its own.
# Keep comments ASCII-only: setup.ps1 copies this block into
# %USERPROFILE%\.dbt\profiles.yml and non-ASCII text risks encoding damage there.
# The copy in ~/.dbt is derived, never hand-edited.
dbt_duckdb_sandbox:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: warehouse.duckdb
      # Default schema for models and seeds. The source declaration in
      # models/staging/_stg__sources.yml names the same value. A seed that
      # sets a custom schema takes this one as a prefix (`main_raw`), so the
      # two stay in step. A clean build proves the match.
      schema: main
      threads: 2