# dbt profile for the sandbox - a complete, valid profiles.yml on its own.
# Keep comments ASCII-only: setup.ps1 copies this block into
# %USERPROFILE%\.dbt\profiles.yml and non-ASCII text risks encoding damage there.
# The copy in ~/.dbt is derived, never hand-edited.
dbt_duckdb_sandbox:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: warehouse.duckdb
      # `schema` in this profile is the default for models and seeds.
      # A custom schema such as `raw` gets the default prefixed to it
      # (`main_raw`), so the source declaration names `raw` only when
      # nothing sets a custom schema. A clean build proves the match.
      schema: main
      threads: 2