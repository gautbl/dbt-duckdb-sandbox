name: Deploy dbt docs

on:
  push:
    branches: [main]
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to gh-pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Same CPython minor version as setup.sh, setup.ps1 and the build
      # workflow, so one environment serves all of them.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # requirements.txt is the one source of the dbt version. Do not pin a
      # version in this file: a drift between the two is the failure to avoid.
      - name: Install dependencies
        run: pip install -r requirements.txt

      # The runner has no ~/.dbt, and the profile lives in the repo. Pass
      # --profiles-dir, as the build workflow does.
      - name: Generate docs
        run: dbt docs generate --profiles-dir .

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: target

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4