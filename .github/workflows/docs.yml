name: Deploy dbt docs

# Generates the dbt docs site and publishes it to GitHub Pages.
#
# The site follows a green build. This workflow triggers on the run of the
# build workflow, not on the push itself, so a red build stops the deploy
# before it starts. The two workflows keep separate verdicts.
#
# A site built from a pull request must not reach Pages. The `push` term in
# the job guard stops that case, because the `branches` filter alone does not.
#
# The deploy retries, because of a race on the GitHub side, not in this file.
# The artifact metadata list that `deploy-pages` reads can stay empty for
# seconds after the upload ends. The deploy then reads `Found 0 artifact(s)`
# and stops in about 350 ms. See actions/deploy-pages issue 451.
#
# A re-run of the same job hits the other face of the same fault. The run then
# holds two `github-pages` artifacts, and the deploy stops with an error that
# counts 2. This workflow answers both faces: one artifact name per
# `github.run_attempt` value, and three tries of the deploy.
#
# The fault first looked like a merge-commit fault, because the first failures
# followed merges. Run 46005499345 is a merge commit and it passed, so the
# merge link was a coincidence.
#
# There is no `workflow_dispatch` trigger here, and that absence is a decision,
# not an oversight. See the comment under `on:`.

on:
  # A push to `main` starts the build workflow. This workflow follows the end
  # of that run.
  workflow_run:
    workflows: ["Build and test the warehouse"]
    types: [completed]
    branches: [main]
  # No `workflow_dispatch` here, on purpose. A dispatch of this workflow would
  # publish with no build verdict to read. Dispatch the build workflow
  # instead: a green run starts this workflow in turn, and the site follows
  # the same edge as a push.
  #
  # `branches` filters the branch of the run that triggers this workflow. A
  # pull request into `main` can carry `main` as its base, so the `event` term
  # in the job guard also has to stop it.

# Sets permissions of the GITHUB_TOKEN to allow deployment to gh-pages.
# The build workflow carries no `pages: write` and no `id-token: write`: it
# needs neither, and a read-only token is the smaller surface.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment. Do not cancel a deployment that
# already runs: a cancelled deploy leaves the Pages environment in an
# unfinished state, and the failure then shows at the next deploy, not here.
# GitHub states this rule in its own Pages starter workflow.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # Only a successful run passes the `conclusion` term, so a failed,
    # cancelled or skipped run stops here. The `event` term stops a run that a
    # pull request started.
    #
    # No `workflow_dispatch` term belongs here. Decision 9 says the site shows
    # no warehouse that failed its tests. A dispatch would publish with no
    # build verdict to read, so it breaks that rule. To redeploy the site,
    # dispatch the build workflow: a green run starts this workflow in turn.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: >-
        ${{ steps.deploy1.outputs.page_url ||
        steps.deploy2.outputs.page_url ||
        steps.deploy3.outputs.page_url }}
    env:
      # One artifact name per `github.run_attempt` value. The upload and the
      # three deploys read the same name. A re-run of this job increments the
      # value, so the new artifact gets a new name, and the run never holds two
      # artifacts with one name.
      PAGES_ARTIFACT: github-pages-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Build the site from the commit that the green build tested. A
          # plain checkout reads the current `main` instead, and a new push
          # can move it before this job starts.
          ref: ${{ github.event.workflow_run.head_sha }}

      # Same CPython minor version as setup.sh, setup.ps1 and the build
      # workflow, so one environment serves all of them.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Same cache as the build workflow, keyed on the same file. The gain is
      # small at one run per push to `main`. The step stays here so that the
      # two workflows show one install shape, not two.
      - name: Cache pip downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-

      # requirements.txt is the one source of the dbt version. Do not pin a
      # version in this file: a drift between the two is the failure to avoid.
      - name: Install dependencies
        run: pip install -r requirements.txt

      # The runner has no ~/.dbt, and the profile lives in the repo. Pass
      # --profiles-dir, as the build workflow does.
      - name: Generate docs
        run: dbt docs generate --profiles-dir .

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: target
          name: ${{ env.PAGES_ARTIFACT }}

      # Try 1. A failed try is not a verdict, so it does not fail the job. A
      # green build still gates the site: a try runs only after the build run
      # and this job pass their own terms.
      - name: Deploy to GitHub Pages (try 1 of 3)
        id: deploy1
        continue-on-error: true
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ env.PAGES_ARTIFACT }}

      # The wait grows. A public probe saw a hide time of 0.4 s to 6 s, and one
      # report names 60 s. The tries land near 0 s, 20 s and 60 s after the
      # upload.
      - name: Wait 20 s before try 2
        if: steps.deploy1.outcome == 'failure'
        run: sleep 20

      - name: Deploy to GitHub Pages (try 2 of 3)
        id: deploy2
        if: steps.deploy1.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ env.PAGES_ARTIFACT }}

      - name: Wait 40 s before try 3
        if: steps.deploy2.outcome == 'failure'
        run: sleep 40

      # Try 3 is the last one, so its result is the result of the job.
      - name: Deploy to GitHub Pages (try 3 of 3)
        id: deploy3
        if: steps.deploy2.outcome == 'failure'
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ env.PAGES_ARTIFACT }}
